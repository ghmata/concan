{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">📄 Importar Novo Manifesto</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Selecione o arquivo PDF do manifesto para importação automática.</p>
                
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="pdf_file" class="form-label fw-bold">Arquivo PDF</label>
                        <input class="form-control form-control-lg" type="file" id="pdf_file" name="pdf_file" accept=".pdf" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">🚀 Processar Manifesto</button>
                        <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

                <div class="alert alert-info mt-3 small">
                    <i class="bi bi-info-circle"></i> O sistema irá extrair automaticamente:
                    <ul class="mb-0">
                        <li>Número e Rota</li>
                        <li>Volumes destinados ao PAMALS</li>
                        <li>Peso e Cubagem</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
