{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 mt-4">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4 text-center">
                <div class="bg-warning bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                    <span style="font-size: 2rem;">🔒</span>
                </div>
                <h4 class="fw-bold mb-1">Alterar Senha</h4>
                <p class="text-muted small">Mantenha sua conta segura</p>
            </div>
            
            <div class="card-body px-4 pb-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Senha Atual</label>
                        <input type="password" name="senha_atual" class="form-control rounded-3" required>
                    </div>
                    
                    <hr class="my-4 text-muted opacity-25">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Nova Senha</label>
                        <input type="password" name="nova_senha" class="form-control rounded-3" required minlength="4">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Confirmar Nova Senha</label>
                        <input type="password" name="confirmar_senha" class="form-control rounded-3" required minlength="4">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill fw-bold py-2">
                            Salvar Nova Senha
                        </button>
                        <a href="/" class="btn btn-outline-secondary rounded-pill border-0">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
