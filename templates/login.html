{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                        <span style="font-size: 2.5rem;">✈️</span>
                    </div>
                    <h3 class="fw-bold text-dark">Conferência CAN</h3>
                    <p class="text-muted small">Acesso restrito a pessoal autorizado</p>
                </div>




                <form method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Usuário" required autofocus>
                        <label for="username">Usuário</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Senha" required>
                        <label for="password">Senha</label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
                        <label class="form-check-label small text-muted user-select-none" for="remember">
                            Lembrar de mim neste dispositivo
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold shadow-sm">
                        Entrar no Sistema
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center border-0 py-3 rounded-bottom-4">
                <small class="text-muted">Versão 2.0 • FAB</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
